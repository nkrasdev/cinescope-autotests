name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Ruff check
        run: uv run ruff check .
      - name: Ruff format (check)
        run: uv run ruff format --check .

  type-check:
    name: Type Checking (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Run ty
        run: uv run ty check tests --exclude tests/ui/ --force-exclude

  security:
    name: Security Check (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Run bandit
        run: uv run bandit -c pyproject.toml -r tests

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, security]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Run unit tests (request/utils/helpers)
        run: >
          uv run pytest
          tests/request
          tests/utils
          tests/constants/test_payment_data_and_ui_data.py
          tests/ui/test_payment_url_matching.py

  api-tests:
    name: API Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, unit-tests]
    environment: ADMIN
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      BASE_AUTH_URL: ${{ secrets.BASE_AUTH_URL }}
      BASE_UI_URL: ${{ secrets.BASE_UI_URL }}
      BASE_PAYMENT_URL: ${{ secrets.BASE_PAYMENT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Validate required API secrets
        if: ${{ env.ADMIN_EMAIL == '' || env.ADMIN_PASSWORD == '' || env.BASE_URL == '' || env.BASE_AUTH_URL == '' || env.BASE_PAYMENT_URL == '' }}
        run: |
          echo "::error::Missing required secrets for API tests. Expected ADMIN_EMAIL, ADMIN_PASSWORD, BASE_URL, BASE_AUTH_URL, BASE_PAYMENT_URL."
          exit 1
      - name: Run API tests with coverage
        run: uv run pytest tests/api -m "not ui" -n auto --dist loadgroup --cov=tests --cov-report=xml --cov-report=html --cov-report=term --cov-fail-under=80
      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/
          retention-days: 7

  ui-tests:
    name: UI Tests
    runs-on: ubuntu-latest
    needs: [lint, type-check, security, unit-tests]
    environment: ADMIN
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      BASE_AUTH_URL: ${{ secrets.BASE_AUTH_URL }}
      BASE_UI_URL: ${{ secrets.BASE_UI_URL }}
      BASE_PAYMENT_URL: ${{ secrets.BASE_PAYMENT_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install --upgrade uv
      - name: Install dependencies
        run: uv sync --dev
      - name: Install Playwright browsers
        run: uv run playwright install --with-deps chromium
      - name: Validate required UI secrets
        if: ${{ env.ADMIN_EMAIL == '' || env.ADMIN_PASSWORD == '' || env.BASE_URL == '' || env.BASE_AUTH_URL == '' || env.BASE_UI_URL == '' || env.BASE_PAYMENT_URL == '' }}
        run: |
          echo "::error::Missing required secrets for UI tests. Expected ADMIN_EMAIL, ADMIN_PASSWORD, BASE_URL, BASE_AUTH_URL, BASE_UI_URL, BASE_PAYMENT_URL."
          exit 1
      - name: Run UI tests
        run: uv run pytest tests/ui -m "ui"
      - name: Upload UI logs/screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-artifacts
          path: |
            logs/
            allure-results/
          retention-days: 7
