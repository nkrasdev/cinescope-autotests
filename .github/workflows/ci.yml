name: CI

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.9.2"

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up test environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Run static analysis and unit tests
        run: make ci-local

      - name: Upload unit-test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-results/
            logs/
          if-no-files-found: ignore
          retention-days: 7

  api-tests:
    name: API tests
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ADMIN
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      BASE_AUTH_URL: ${{ secrets.BASE_AUTH_URL }}
      BASE_PAYMENT_URL: ${{ secrets.BASE_PAYMENT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up test environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Validate required secrets
        run: >-
          bash .github/scripts/require-environment.sh
          ADMIN_EMAIL ADMIN_PASSWORD BASE_URL BASE_AUTH_URL BASE_PAYMENT_URL

      - name: Run API tests with coverage
        run: >-
          uv run --frozen pytest tests/api -m "not ui"
          -n 4 --dist loadgroup
          --cov=tests
          --cov-report=xml
          --cov-report=html
          --cov-report=term-missing
          --cov-fail-under=80

      - name: Upload API-test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: api-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage.xml
            htmlcov/
            allure-results/
            logs/
          if-no-files-found: ignore
          retention-days: 7

  ui-tests:
    name: UI tests
    if: >-
      ${{
        github.event_name != 'pull_request' ||
        (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
      }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ADMIN
    env:
      ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      BASE_URL: ${{ secrets.BASE_URL }}
      BASE_AUTH_URL: ${{ secrets.BASE_AUTH_URL }}
      BASE_UI_URL: ${{ secrets.BASE_UI_URL }}
      BASE_PAYMENT_URL: ${{ secrets.BASE_PAYMENT_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up test environment
        uses: ./.github/actions/setup-test-environment
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Validate required secrets
        run: >-
          bash .github/scripts/require-environment.sh
          ADMIN_EMAIL ADMIN_PASSWORD BASE_URL BASE_AUTH_URL BASE_UI_URL BASE_PAYMENT_URL

      - name: Install Chromium
        run: uv run --frozen playwright install --with-deps chromium

      - name: Run UI tests
        run: uv run --frozen pytest tests/ui -m "ui" -n 2 --dist loadgroup

      - name: Upload UI-test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ui-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            allure-results/
            logs/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
